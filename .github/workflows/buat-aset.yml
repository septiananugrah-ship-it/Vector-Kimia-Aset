name: Buat aset

on:
  workflow_dispatch:
    inputs:
      size:
        description: "Sisi panjang JPG/PNG ikon tunggal (px)"
        default: "4000"
      only:
        description: "Hanya set tertentu (pisahkan spasi, kosong = semua)"
        default: ""
  push:
    branches: [main]
    paths: ["src/**", "fonts/**", "build.py", "promo.py", "gallery.py", "requirements.txt", ".github/workflows/**"]

# push beruntun: batalkan run lama, cukup bangun commit terbaru
concurrency:
  group: buat-aset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: pip install -r requirements.txt
      - name: Bangun semua set
        env:
          SIZE: ${{ inputs.size || '4000' }}
          ONLY: ${{ inputs.only }}
        run: python build.py --size "$SIZE" ${ONLY:+--only $ONLY}
      - name: Gambar promosi bundle
        if: ${{ !inputs.only }}
        run: python promo.py
      - name: Galeri pratinjau (GitHub Pages)
        if: ${{ !inputs.only }}
        run: python gallery.py
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.only }}
        with:
          path: dist/galeri
      # satu artefak unduhan per kategori
      - uses: actions/upload-artifact@v4
        with:
          name: 1-alat-lab
          path: dist/1-alat-lab/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 2-molekul-atom
          path: dist/2-molekul-atom/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 3-poster-edukasi
          path: dist/3-poster-edukasi/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 4-pola-seamless
          path: dist/4-pola-seamless/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 5-latar-presentasi
          path: dist/5-latar-presentasi/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 6-template-sosmed
          path: dist/6-template-sosmed/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 7-lembar-kerja-mewarnai
          path: dist/7-lembar-kerja-mewarnai/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 8-stiker-kawaii
          path: dist/8-stiker-kawaii/*.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: 9-promosi
          path: dist/9-promosi.zip
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: katalog
          path: dist/katalog.csv

  # Galeri di https://<pemilik>.github.io/<repo>/ — aktifkan sekali di Settings → Pages → Source: GitHub Actions.
  # Jika Pages belum aktif, langkah ini gagal tanpa membuat build merah.
  pages:
    needs: build
    if: ${{ !inputs.only }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
